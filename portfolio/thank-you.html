<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Thank You - Message Sent Successfully</title>
    <link rel="stylesheet" href="styles/main.css">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body>
    <section class="hero" style="min-height: 100vh; display: flex; align-items: center; justify-content: center;">
        <div class="container" style="text-align: center;">
            <div style="max-width: 600px; margin: 0 auto;">
                <div style="font-size: 4rem; color: #667eea; margin-bottom: 2rem;">
                    <i class="fas fa-check-circle"></i>
                </div>
                <h1 style="font-size: 3rem; margin-bottom: 1rem; color: #2d3748;">Thank You!</h1>
                <p style="font-size: 1.2rem; color: #4a5568; margin-bottom: 2rem; line-height: 1.6;">
                    Your message has been sent successfully! I'll get back to you as soon as possible.
                </p>
                <div style="margin-top: 3rem;">
                    <a href="index.html" class="btn btn-primary" style="margin-right: 1rem;">
                        <i class="fas fa-arrow-left"></i> Back to Portfolio
                    </a>
                    <a href="index.html#contact" class="btn btn-secondary">
                        <i class="fas fa-envelope"></i> Send Another Message
                    </a>
                </div>
                
                <div style="margin-top: 3rem; padding: 2rem; background: rgba(102, 126, 234, 0.1); border-radius: 15px;">
                    <h3 style="color: #667eea; margin-bottom: 1rem;">What's Next?</h3>
                    <p style="color: #4a5568; margin-bottom: 1rem;">
                        I typically respond to messages within 24-48 hours. In the meantime, feel free to:
                    </p>
                    <div style="display: flex; justify-content: center; gap: 2rem; flex-wrap: wrap; margin-top: 2rem;">
                        <a href="index.html#projects" style="color: #667eea; text-decoration: none;">
                            <i class="fas fa-code"></i> View My Projects
                        </a>
                        <a href="index.html#skills" style="color: #667eea; text-decoration: none;">
                            <i class="fas fa-tools"></i> Check My Skills
                        </a>
                        <a href="index.html#experience" style="color: #667eea; text-decoration: none;">
                            <i class="fas fa-briefcase"></i> See My Experience
                        </a>
                    </div>
                </div>
            </div>
        </div>
    </section>
</body>
</html>
